name: A workflow for my coursework
on: push


jobs:
  build:
    name: Coursework action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run docker compose
        run: docker compose up -d

      - name: Wait for database
        run: sleep 20

      - name: MyTest
        run: mvn -Dtest=com.napier.sem.MyTest test

      - name: Build Docker Image
        run: docker build -t diskimage .

      - name: Run image
        run: docker run --name containerised -d diskimage

      - name: View logs
        run: docker logs containerised



