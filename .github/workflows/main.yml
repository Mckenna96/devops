name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package

      - name: Check target contents
        run: ls -la target

      - name: Check current directory
        run:
          pwd
          ls -la
          ls -la target/fodtwareEmethods-0.1.0.2-jar-with-dependencies.jar

      - name: Build Docker Image
        run: docker build -t diskImage .

      - name: Run image
        run: docker run --name containerised -d DiskImage

      - name: View logs
        run: docker logs containerised